name: CI/CD

on:
    push:
        branches:
            - main
            - beta
    pull_request:
        branches:
            - main
            - beta

env:
    CI: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Use Node.js 18
              uses: actions/setup-node@v3
              with:
                  node-version: 18.x

            - run: npm install

            - run: npm run build

            - run: npm run lint

